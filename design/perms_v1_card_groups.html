<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>权限管理 - 方案 1（分组卡片）- 金山仓储</title>
<link rel="stylesheet" href="mockup_shared.css">
<style>
.perm-page { max-width: 1100px; margin: 0 auto; }
.user-banner {
    background: linear-gradient(135deg, #1677FF 0%, #4096FF 100%);
    color: #FFF;
    padding: 20px 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(22,119,255,0.18);
}
.user-banner .user-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600;
}
.user-banner .user-info { display: flex; align-items: center; gap: 16px; }
.user-banner .user-info h2 { font-size: 18px; font-weight: 600; }
.user-banner .user-info .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.summary-bar {
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    padding: 14px 20px;
    margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
}
.summary-bar .left { font-size: 14px; }
.summary-bar .left strong { font-size: 22px; color: var(--ant-primary); font-family: var(--font-num); }

.perm-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}
.perm-card {
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    overflow: hidden;
    transition: box-shadow 0.2s;
}
.perm-card:hover { box-shadow: var(--shadow-md); }
.perm-card-head {
    padding: 12px 16px;
    background: #FAFAFA;
    border-bottom: 1px solid var(--ant-divider);
    display: flex; justify-content: space-between; align-items: center;
}
.perm-card-head .group-name {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 600;
}
.perm-card-head .group-icon {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--ant-primary-light);
    color: var(--ant-primary);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px;
}
.perm-card-head .group-count {
    font-size: 12px; color: var(--ant-text-secondary);
    padding: 2px 8px; background: #FFF; border-radius: 10px;
    border: 1px solid var(--ant-divider);
}
.perm-card-head .group-count.full {
    background: var(--ant-success-bg); color: var(--ant-success); border-color: #B7EB8F;
}
.perm-card-head .toggle-all {
    font-size: 12px; color: var(--ant-primary);
    cursor: pointer; user-select: none;
}
.perm-card-body { padding: 8px 0; }
.perm-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
}
.perm-item:hover { background: var(--ant-bg-hover); }
.perm-item.checked {
    border-left-color: var(--ant-primary);
    background: rgba(22,119,255,0.04);
}
.perm-item input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
.perm-item .label { font-size: 13px; flex: 1; }
.perm-item .key {
    font-family: var(--font-num); font-size: 11px;
    color: var(--ant-text-tertiary);
    padding: 1px 6px; background: #FAFAFA; border-radius: 3px;
}
.progress-mini {
    height: 4px; background: var(--ant-divider); border-radius: 2px; overflow: hidden;
    width: 80px;
}
.progress-mini .bar { height: 100%; background: var(--ant-primary); transition: width 0.4s; }

.footer-actions {
    margin-top: 24px;
    padding: 16px 20px;
    background: #FFF;
    border-top: 1px solid var(--ant-divider);
    border-radius: 6px;
    display: flex; justify-content: flex-end; gap: 8px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
    position: sticky; bottom: 0;
}
</style>
</head>
<body>

<div class="demo-banner">
    <strong>UI 方案 1：分组卡片</strong> ｜ 这是给客户看的样品，按一级菜单分组的卡片网格，每张卡片可单独全选/反选
</div>

<div class="content" style="padding: 24px;">
<div class="perm-page">

    <a href="index.html" class="btn btn-sm" style="margin-bottom: 16px;">‹ 返回方案列表</a>

    <div class="user-banner">
        <div class="user-info">
            <div class="user-avatar">王</div>
            <div>
                <h2>王经理 <span class="tag tag-info" style="margin-left:8px;">manager</span></h2>
                <div class="sub">手机 138****6688 · 邮箱 wang@example.com · 岗位：仓库经理、库存控制员</div>
            </div>
        </div>
        <div style="text-align:right;">
            <div style="font-size:12px;opacity:0.85;">最后登录</div>
            <div style="font-family:var(--font-num);">2026-05-20 09:14</div>
        </div>
    </div>

    <div class="summary-bar">
        <div class="left">已勾选 <strong>9</strong> / 13 项菜单权限</div>
        <div class="right">
            <button class="btn btn-sm">全部取消</button>
            <button class="btn btn-sm">全部勾选</button>
        </div>
    </div>

    <div class="perm-grid">

        <!-- 工作台组 -->
        <div class="perm-card">
            <div class="perm-card-head">
                <div class="group-name">
                    <span class="group-icon">▦</span> 工作台
                    <span class="group-count full">2 / 2</span>
                </div>
                <span class="toggle-all">取消该组</span>
            </div>
            <div class="perm-card-body">
                <label class="perm-item checked">
                    <input type="checkbox" checked>
                    <span class="label">工作台首页</span>
                    <span class="key">index</span>
                </label>
                <label class="perm-item checked">
                    <input type="checkbox" checked>
                    <span class="label">待审批中心</span>
                    <span class="key">pending</span>
                </label>
            </div>
        </div>

        <!-- 业务组 -->
        <div class="perm-card">
            <div class="perm-card-head">
                <div class="group-name">
                    <span class="group-icon">⊞</span> 业务
                    <span class="group-count">2 / 3</span>
                </div>
                <span class="toggle-all">全选该组</span>
            </div>
            <div class="perm-card-body">
                <label class="perm-item checked">
                    <input type="checkbox" checked>
                    <span class="label">入库管理</span>
                    <span class="key">inbound</span>
                </label>
                <label class="perm-item checked">
                    <input type="checkbox" checked>
                    <span class="label">出库管理</span>
                    <span class="key">pick</span>
                </label>
                <label class="perm-item">
                    <input type="checkbox">
                    <span class="label">退换货</span>
                    <span class="key">return</span>
                </label>
            </div>
        </div>

        <!-- 仓库管理组 -->
        <div class="perm-card">
            <div class="perm-card-head">
                <div class="group-name">
                    <span class="group-icon">▣</span> 仓库管理
                    <span class="group-count full">5 / 5</span>
                </div>
                <span class="toggle-all">取消该组</span>
            </div>
            <div class="perm-card-body">
                <label class="perm-item checked"><input type="checkbox" checked><span class="label">库存查询</span><span class="key">inventory</span></label>
                <label class="perm-item checked"><input type="checkbox" checked><span class="label">商品调拨</span><span class="key">transfer</span></label>
                <label class="perm-item checked"><input type="checkbox" checked><span class="label">存储区管理</span><span class="key">storage</span></label>
                <label class="perm-item checked"><input type="checkbox" checked><span class="label">报损管理</span><span class="key">damage</span></label>
                <label class="perm-item checked"><input type="checkbox" checked><span class="label">盘点</span><span class="key">stocktake</span></label>
            </div>
        </div>

        <!-- 商品管理 -->
        <div class="perm-card">
            <div class="perm-card-head">
                <div class="group-name">
                    <span class="group-icon">◈</span> 商品管理
                    <span class="group-count">0 / 2</span>
                </div>
                <span class="toggle-all">全选该组</span>
            </div>
            <div class="perm-card-body">
                <label class="perm-item"><input type="checkbox"><span class="label">商品列表</span><span class="key">sku</span></label>
                <label class="perm-item"><input type="checkbox"><span class="label">供应商</span><span class="key">supplier</span></label>
            </div>
        </div>

        <!-- 系统 -->
        <div class="perm-card" style="grid-column: 1 / -1;">
            <div class="perm-card-head">
                <div class="group-name">
                    <span class="group-icon">⚙</span> 系统
                    <span class="group-count">0 / 1</span>
                </div>
                <span class="toggle-all">全选该组</span>
            </div>
            <div class="perm-card-body">
                <label class="perm-item"><input type="checkbox"><span class="label">通知渠道与预警</span><span class="key">channel_config</span></label>
            </div>
        </div>

    </div>

    <div class="footer-actions">
        <button class="btn">取消</button>
        <button class="btn btn-primary">保存权限（9 项）</button>
    </div>

</div>
</div>

<script>
document.querySelectorAll('.perm-item input').forEach(cb => {
    cb.addEventListener('change', () => {
        cb.closest('label').classList.toggle('checked', cb.checked);
    });
});
</script>

</body>
</html>
