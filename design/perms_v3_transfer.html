<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>权限管理 - 方案 3（双列穿梭框）- 金山仓储</title>
<link rel="stylesheet" href="mockup_shared.css">
<style>
.perm-page { max-width: 1200px; margin: 0 auto; }

.user-banner {
    background: #FFF;
    border: 1px solid var(--ant-divider);
    padding: 18px 24px;
    border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
}

.transfer {
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    gap: 16px;
    align-items: stretch;
}
.transfer-box {
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 480px;
}
.transfer-head {
    padding: 12px 16px;
    background: #FAFAFA;
    border-bottom: 1px solid var(--ant-divider);
    display: flex; justify-content: space-between; align-items: center;
}
.transfer-head .title { font-size: 14px; font-weight: 600; }
.transfer-head .count { font-size: 12px; color: var(--ant-text-secondary); }
.transfer-head .count strong {
    color: var(--ant-primary);
    font-family: var(--font-num);
}

.transfer-search {
    padding: 10px 16px;
    border-bottom: 1px solid var(--ant-divider);
}
.transfer-search input {
    width: 100%; padding: 6px 10px;
    border: 1px solid var(--ant-divider);
    border-radius: 4px;
    font-size: 13px;
}
.transfer-search input:focus {
    outline: none;
    border-color: var(--ant-primary);
    box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
}

.transfer-list {
    flex: 1;
    padding: 8px 0;
    overflow-y: auto;
}
.transfer-group {
    padding: 6px 16px 4px;
    font-size: 11px; color: var(--ant-text-tertiary);
    text-transform: uppercase; letter-spacing: 0.5px;
    background: #FCFCFC;
}
.transfer-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 13px;
}
.transfer-item:hover { background: var(--ant-bg-hover); }
.transfer-item.selected { background: var(--ant-primary-light); }
.transfer-item input { width: 14px; height: 14px; cursor: pointer; }
.transfer-item .name { flex: 1; }
.transfer-item .key {
    font-family: var(--font-num); font-size: 11px;
    color: var(--ant-text-tertiary);
}

.transfer-actions {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 12px;
}
.arrow-btn {
    width: 40px; height: 40px;
    border: 1px solid var(--ant-divider);
    background: #FFF;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: var(--ant-text-tertiary);
    cursor: pointer;
    transition: all 0.2s;
}
.arrow-btn:hover {
    background: var(--ant-primary);
    color: #FFF;
    border-color: var(--ant-primary);
}
.arrow-btn.disabled {
    opacity: 0.4; cursor: not-allowed;
}

.transfer-foot {
    padding: 10px 16px;
    border-top: 1px solid var(--ant-divider);
    background: #FAFAFA;
    font-size: 12px; color: var(--ant-text-secondary);
    display: flex; justify-content: space-between;
}
.transfer-foot a { color: var(--ant-primary); }

.footer-actions {
    margin-top: 20px;
    padding: 16px 20px;
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    display: flex; justify-content: flex-end; gap: 8px;
}
</style>
</head>
<body>

<div class="demo-banner">
    <strong>UI 方案 3：双列穿梭框</strong> ｜ 经典 Ant Design Transfer 风格 — 左侧可分配 / 右侧已授权 / 中间箭头转移
</div>

<div class="content" style="padding: 24px;">
<div class="perm-page">

    <a href="index.html" class="btn btn-sm" style="margin-bottom: 16px;">‹ 返回方案列表</a>

    <div class="user-banner">
        <div style="display:flex; align-items:center; gap:14px;">
            <div style="width:44px;height:44px;border-radius:50%;background:var(--ant-primary);color:#FFF;display:flex;align-items:center;justify-content:center;font-weight:600;">张</div>
            <div>
                <h2 style="font-size:16px;font-weight:600;">张志强 <span class="tag tag-default" style="margin-left:6px;">staff</span></h2>
                <div class="text-secondary" style="font-size:12px;margin-top:2px;">岗位：出库员 · zhang@example.com</div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-secondary" style="font-size:12px;">权限分配</div>
            <div style="font-size:18px;font-family:var(--font-num);" class="fw-bold">
                <span class="text-tertiary">8</span> → <span class="text-primary">5</span> / 13
            </div>
        </div>
    </div>

    <div class="transfer">
        <!-- 左：可分配 -->
        <div class="transfer-box">
            <div class="transfer-head">
                <div>
                    <span class="title">可分配权限</span>
                    <span class="count" style="margin-left:8px;">已选 <strong>2</strong> / 8 项</span>
                </div>
                <a href="#" style="font-size:12px;color:var(--ant-primary);">全选</a>
            </div>
            <div class="transfer-search">
                <input placeholder="搜索菜单名称...">
            </div>
            <div class="transfer-list">
                <div class="transfer-group">工作台</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">待审批中心</span>
                    <span class="key">pending</span>
                </label>

                <div class="transfer-group">业务</div>
                <label class="transfer-item selected">
                    <input type="checkbox" checked>
                    <span class="name">入库管理</span>
                    <span class="key">inbound</span>
                </label>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">退换货</span>
                    <span class="key">return</span>
                </label>

                <div class="transfer-group">仓库管理</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">商品调拨</span>
                    <span class="key">transfer</span>
                </label>
                <label class="transfer-item selected">
                    <input type="checkbox" checked>
                    <span class="name">存储区管理</span>
                    <span class="key">storage</span>
                </label>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">报损管理</span>
                    <span class="key">damage</span>
                </label>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">盘点</span>
                    <span class="key">stocktake</span>
                </label>

                <div class="transfer-group">系统</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">通知渠道与预警</span>
                    <span class="key">channel_config</span>
                </label>
            </div>
            <div class="transfer-foot">
                <span>共 8 项可选</span>
                <a href="#">导入预设</a>
            </div>
        </div>

        <!-- 中：箭头按钮 -->
        <div class="transfer-actions">
            <button class="arrow-btn" title="移到右侧">→</button>
            <button class="arrow-btn disabled" title="移到左侧">←</button>
        </div>

        <!-- 右：已授权 -->
        <div class="transfer-box" style="border-left: 3px solid var(--ant-success);">
            <div class="transfer-head">
                <div>
                    <span class="title">已授权权限</span>
                    <span class="count" style="margin-left:8px;">共 <strong>5</strong> 项</span>
                </div>
                <a href="#" style="font-size:12px;color:var(--ant-error);">全部清空</a>
            </div>
            <div class="transfer-search">
                <input placeholder="搜索已授权...">
            </div>
            <div class="transfer-list">
                <div class="transfer-group">工作台</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">工作台首页</span>
                    <span class="key">index</span>
                </label>

                <div class="transfer-group">业务</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">出库管理</span>
                    <span class="key">pick</span>
                </label>

                <div class="transfer-group">仓库管理</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">库存查询</span>
                    <span class="key">inventory</span>
                </label>

                <div class="transfer-group">商品管理</div>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">商品列表</span>
                    <span class="key">sku</span>
                </label>
                <label class="transfer-item">
                    <input type="checkbox">
                    <span class="name">供应商</span>
                    <span class="key">supplier</span>
                </label>
            </div>
            <div class="transfer-foot">
                <span>已授权 5 项 · 占总数 38%</span>
                <a href="#" class="text-secondary">查看变更预览</a>
            </div>
        </div>
    </div>

    <div class="footer-actions">
        <button class="btn">取消</button>
        <button class="btn btn-primary">保存权限</button>
    </div>

</div>
</div>

<script>
document.querySelectorAll('.transfer-item input').forEach(cb => {
    cb.addEventListener('change', () => {
        cb.closest('label').classList.toggle('selected', cb.checked);
    });
});
</script>

</body>
</html>
