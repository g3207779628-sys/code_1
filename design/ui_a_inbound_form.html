<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 A · 新建入库单 · 金山仓储</title>
<link rel="stylesheet" href="ui_cream_shared.css">
<style>
.content { padding: 40px 48px; max-width: 900px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--ink-quiet); margin-bottom: 28px; }

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 24px;
    margin-bottom: 16px;
}

.picker-row {
    display: flex; align-items: center; gap: 10px;
}
.picker-label {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--line-input);
    border-radius: var(--r-md);
    padding: 9px 12px;
    color: var(--ink-quiet);
    font-size: 14px;
}
.picker-label.filled { color: var(--ink); }

.items-table {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--bg-card);
    overflow: hidden;
}
.items-head {
    background: var(--bg-row-hover);
    padding: 10px 16px;
    display: grid;
    grid-template-columns: 2fr 1.5fr 1.5fr 1fr 60px;
    gap: 12px;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--ink-quiet);
    letter-spacing: 0.5px;
    font-weight: 600;
}
.items-row {
    padding: 12px 16px;
    border-top: 1px solid var(--line-soft);
    display: grid;
    grid-template-columns: 2fr 1.5fr 1.5fr 1fr 60px;
    gap: 12px;
    align-items: center;
}
.items-row .field { padding: 6px 10px; font-size: 13px; }
.items-row .btn-x {
    color: var(--err);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

.foot-actions {
    margin-top: 24px;
    padding: 18px 0;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
}
.foot-actions .left { color: var(--ink-quiet); font-size: 13px; }
.foot-actions .right { display: flex; gap: 8px; }
</style>
</head>
<body>

<div class="demo-banner"><strong>方案 A · 纯净极简</strong> · 新建入库单</div>

<div class="layout">
    <aside class="sider">
        <div class="sider-brand"><span class="mark">金</span>金山仓储</div>
        <ul class="menu">
            <li class="menu-group">日常使用</li>
            <li><a href="#">工作台 <span class="arrow">›</span></a></li>
            <li><a href="#">待审批中心 <span class="arrow">›</span></a></li>
            <li class="menu-group">日常操作</li>
            <li><a href="#" class="active">入库 <span class="arrow">›</span></a></li>
            <li><a href="#">出库 <span class="arrow">›</span></a></li>
            <li><a href="#">调拨 <span class="arrow">›</span></a></li>
            <li><a href="#">报损 <span class="arrow">›</span></a></li>
            <li><a href="#">盘点 <span class="arrow">›</span></a></li>
            <li class="menu-group">查询分析</li>
            <li><a href="#">库存查询 <span class="arrow">›</span></a></li>
        </ul>
    </aside>

    <div class="main">
        <header class="header">
            <div class="crumb"><span class="prev">日常操作 / 入库</span><span class="sep">/</span><span class="now">新建入库单</span></div>
            <div class="header-actions">
                <span class="user-name">王经理</span>
                <span class="quiet">改密</span>
                <span class="quiet">退出</span>
            </div>
        </header>

        <div class="content">
            <div class="page-title">新建入库单</div>
            <div class="page-sub">保存为草稿后，需要仓库经理审批方可入账</div>

            <div class="form-grid">
                <div class="form-row">
                    <label>入库仓库 <span class="text-error">*</span></label>
                    <div class="picker-row">
                        <span class="picker-label filled">金山主仓</span>
                        <button class="btn btn-sm">选择仓库</button>
                    </div>
                </div>
                <div class="form-row">
                    <label>供应商 <span class="text-error">*</span></label>
                    <div class="picker-row">
                        <span class="picker-label filled">贵州茅台经销商</span>
                        <button class="btn btn-sm">选择供应商</button>
                    </div>
                </div>
                <div class="form-row" style="grid-column: 1 / -1;">
                    <label>备注</label>
                    <input type="text" placeholder="可选" value="月度补货">
                </div>
                <div class="form-row" style="grid-column: 1 / -1;">
                    <label>附件<span class="hint">（可多选，单文件 ≤ 10MB）</span></label>
                    <input type="file" multiple>
                </div>
            </div>

            <div class="section-title" style="font-size: 11px; color: var(--ink-quiet); letter-spacing: 2px; margin: 24px 0 12px; text-transform: uppercase; font-weight: 600;">— 入库明细</div>

            <div class="items-table">
                <div class="items-head">
                    <div>商品</div>
                    <div>批次号</div>
                    <div>入库位</div>
                    <div>数量</div>
                    <div></div>
                </div>
                <div class="items-row">
                    <div class="picker-row">
                        <span class="picker-label filled">茅台</span>
                        <button class="btn btn-sm">选</button>
                    </div>
                    <input type="text" class="field" value="MT-FW-500-001" placeholder="留空自动生成">
                    <div class="picker-row">
                        <span class="picker-label filled">酒柜-A1</span>
                        <button class="btn btn-sm">选</button>
                    </div>
                    <input type="number" class="field" value="20">
                    <button class="btn-x">×</button>
                </div>
                <div class="items-row">
                    <div class="picker-row">
                        <span class="picker-label filled">五粮液</span>
                        <button class="btn btn-sm">选</button>
                    </div>
                    <input type="text" class="field" value="" placeholder="留空自动生成">
                    <div class="picker-row">
                        <span class="picker-label filled">酒柜-A1</span>
                        <button class="btn btn-sm">选</button>
                    </div>
                    <input type="number" class="field" value="12">
                    <button class="btn-x">×</button>
                </div>
                <div class="items-row">
                    <div class="picker-row">
                        <span class="picker-label" style="color:var(--ink-faded);">未选择</span>
                        <button class="btn btn-sm">选</button>
                    </div>
                    <input type="text" class="field" placeholder="留空自动生成">
                    <div class="picker-row">
                        <span class="picker-label" style="color:var(--ink-faded);">未选择</span>
                        <button class="btn btn-sm">选</button>
                    </div>
                    <input type="number" class="field" placeholder="数量">
                    <button class="btn-x">×</button>
                </div>
            </div>
            <button class="btn btn-sm" style="margin-top: 10px;">+ 添加一行</button>

            <div class="foot-actions">
                <div class="left">合计：<strong style="color: var(--ink);">2</strong> 个商品 · <strong style="color: var(--accent);">32</strong> 件</div>
                <div class="right">
                    <button class="btn">取消</button>
                    <button class="btn btn-primary">提交</button>
                </div>
            </div>

            <div style="margin-top: 32px; text-align: center;">
                <a href="ui_a_inventory.html" class="btn btn-sm">‹ 上一页 库存查询</a>
                <a href="ui_redesign_index.html" class="btn btn-sm">返回方案对比</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
