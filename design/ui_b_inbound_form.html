<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 B · 新建入库单 · 金山仓储</title>
<link rel="stylesheet" href="ui_cream_shared.css">
<style>
.menu li > a.active { border-left-width: 4px; font-weight: 700; }
.content { padding: 36px 48px; max-width: 920px; }
.page-title { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--ink-quiet); margin-bottom: 28px; }

.form-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: var(--r-lg);
    padding: 28px 30px;
    margin-bottom: 20px;
}
.form-card-title {
    font-size: 14px; font-weight: 700; color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
}
.form-card-title::before {
    content: "";
    width: 4px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
.picker-row { display: flex; align-items: center; gap: 10px; }
.picker-label {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--line-input);
    border-radius: var(--r-md);
    padding: 9px 12px;
    color: var(--ink-quiet);
    font-size: 14px;
}
.picker-label.filled { color: var(--ink); font-weight: 500; }

.items-table { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.items-head {
    background: var(--accent);
    color: #FFF;
    padding: 11px 16px;
    display: grid;
    grid-template-columns: 2fr 1.5fr 1.5fr 1fr 60px;
    gap: 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
}
.items-row {
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 2fr 1.5fr 1.5fr 1fr 60px;
    gap: 12px;
    align-items: center;
    background: var(--bg-card);
}
.items-row .field { padding: 7px 10px; font-size: 13px; }
.btn-x { color: var(--err); background: transparent; border: 1px solid var(--err-bg); padding: 4px 10px; border-radius: var(--r-sm); cursor: pointer; }

.foot-actions {
    margin-top: 20px;
    padding: 16px 22px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    display: flex; justify-content: space-between; align-items: center;
}
.summary {
    font-size: 14px;
}
.summary .big { color: var(--accent); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="demo-banner"><strong>方案 B · 橙色显眼</strong> · 新建入库单</div>

<div class="layout">
    <aside class="sider">
        <div class="sider-brand"><span class="mark">金</span>金山仓储</div>
        <ul class="menu">
            <li class="menu-group">日常使用</li>
            <li><a href="#">工作台</a></li>
            <li><a href="#">待审批中心</a></li>
            <li class="menu-group">日常操作</li>
            <li><a href="#" class="active">入库</a></li>
            <li><a href="#">出库</a></li>
            <li><a href="#">调拨</a></li>
            <li class="menu-group">查询分析</li>
            <li><a href="#">库存查询</a></li>
        </ul>
    </aside>

    <div class="main">
        <header class="header">
            <div class="crumb"><span class="prev">日常操作 / 入库</span><span class="sep">/</span><span class="now">新建入库单</span></div>
            <div class="header-actions">
                <span class="user-name">王经理</span>
                <span class="quiet">改密</span>
                <span class="quiet">退出</span>
            </div>
        </header>

        <div class="content">
            <div class="page-title">新建入库单</div>
            <div class="page-sub">保存为草稿后，需要仓库经理审批方可入账</div>

            <div class="form-card">
                <div class="form-card-title">基本信息</div>
                <div class="form-grid">
                    <div class="form-row">
                        <label>入库仓库 <span class="text-error">*</span></label>
                        <div class="picker-row">
                            <span class="picker-label filled">金山主仓</span>
                            <button class="btn btn-primary btn-sm">选择仓库</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>供应商 <span class="text-error">*</span></label>
                        <div class="picker-row">
                            <span class="picker-label filled">贵州茅台经销商</span>
                            <button class="btn btn-primary btn-sm">选择供应商</button>
                        </div>
                    </div>
                    <div class="form-row" style="grid-column: 1 / -1;">
                        <label>备注</label>
                        <input type="text" placeholder="可选" value="月度补货">
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div class="form-card-title">入库明细</div>
                <div class="items-table">
                    <div class="items-head">
                        <div>商品</div><div>批次号</div><div>入库位</div><div>数量</div><div></div>
                    </div>
                    <div class="items-row">
                        <div class="picker-row"><span class="picker-label filled">茅台</span><button class="btn btn-sm">选</button></div>
                        <input type="text" class="field" value="MT-FW-500-001">
                        <div class="picker-row"><span class="picker-label filled">酒柜-A1</span><button class="btn btn-sm">选</button></div>
                        <input type="number" class="field" value="20">
                        <button class="btn-x">×</button>
                    </div>
                    <div class="items-row">
                        <div class="picker-row"><span class="picker-label filled">五粮液</span><button class="btn btn-sm">选</button></div>
                        <input type="text" class="field" placeholder="留空自动生成">
                        <div class="picker-row"><span class="picker-label filled">酒柜-A1</span><button class="btn btn-sm">选</button></div>
                        <input type="number" class="field" value="12">
                        <button class="btn-x">×</button>
                    </div>
                </div>
                <button class="btn btn-sm" style="margin-top: 12px;">+ 添加一行</button>
            </div>

            <div class="foot-actions">
                <div class="summary">合计：2 个商品 · <span class="big">32</span> 件</div>
                <div style="display:flex;gap:8px;">
                    <button class="btn">取消</button>
                    <button class="btn btn-primary">提交</button>
                </div>
            </div>

            <div style="margin-top: 32px; text-align: center;">
                <a href="ui_b_inventory.html" class="btn btn-sm">‹ 上一页 库存查询</a>
                <a href="ui_redesign_index.html" class="btn btn-sm">返回方案对比</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
