<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 A · 登录后欢迎页 · 金山仓储</title>
<link rel="stylesheet" href="ui_red_shared.css">
<style>
.welcome-page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: radial-gradient(circle at 50% 35%, #FFF0EA 0%, #FFFAF7 65%);
}
.welcome-top {
    padding: 28px 48px;
    display: flex; justify-content: space-between; align-items: center;
}
.welcome-brand {
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    color: var(--ink);
    display: flex; align-items: center; gap: 10px;
}
.welcome-brand .mark {
    width: 26px; height: 26px;
    background: var(--accent);
    color: #FFF; border-radius: var(--r-md);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: 0;
}
.welcome-top .time { font-size: 12px; color: var(--ink-quiet); letter-spacing: 1px; }
.welcome-main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 32px;
}
.welcome-mark {
    font-size: 13px;
    color: var(--ink-quiet);
    letter-spacing: 8px;
    margin-bottom: 12px;
}
.welcome-mega {
    font-size: 120px;
    font-weight: 800;
    letter-spacing: 14px;
    line-height: 1;
    margin-bottom: 24px;
}
.welcome-mega .fill   { color: var(--accent); }
.welcome-mega .stroke { color: transparent; -webkit-text-stroke: 2px var(--accent); }
.welcome-sub {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 8px;
    color: var(--ink-soft);
    margin-bottom: 8px;
}
.welcome-meta {
    font-size: 11px;
    color: var(--ink-faded);
    letter-spacing: 3px;
    margin-top: 14px;
}
.welcome-card {
    margin-top: 56px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px 32px;
    display: flex; align-items: center; gap: 24px;
    min-width: 420px;
}
.welcome-card .avatar {
    width: 52px; height: 52px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
}
.welcome-card .info { flex: 1; }
.welcome-card .info .name {
    font-size: 17px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
}
.welcome-card .info .sub {
    font-size: 12px; color: var(--ink-quiet);
}
.welcome-card .btn-enter {
    background: var(--accent);
    color: #FFF;
    border-radius: var(--r-sm);
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: background 0.15s;
}
.welcome-card .btn-enter:hover { background: var(--accent-deep); }

.welcome-foot {
    padding: 24px 48px;
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-faded);
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="demo-banner">
    <strong>方案 A · 纯净极简</strong> · 登录后所有人先看到这里 · 点"进入工作台"跳转
</div>

<div class="welcome-page">
    <div class="welcome-top">
        <div class="welcome-brand">
            <span class="mark">金</span> 金山仓储
        </div>
        <div class="time">2026-05-21 · 14:32</div>
    </div>

    <div class="welcome-main">
        <div class="welcome-mark">· KINGSOFT WAREHOUSE ·</div>
        <div class="welcome-mega">
            <span class="fill">WEL</span><span class="stroke">COME</span>
        </div>
        <div class="welcome-sub">金山仓储</div>
        <div class="welcome-meta">KINGSOFT · WAREHOUSE MANAGEMENT</div>

        <div class="welcome-card">
            <div class="avatar">王</div>
            <div class="info">
                <div class="name">王经理</div>
                <div class="sub">仓库经理 · 上次登录 2026-05-20 17:18</div>
            </div>
            <button class="btn-enter">进入工作台 →</button>
        </div>
    </div>

    <div class="welcome-foot">
        <div>金山仓储 V6.1</div>
        <div>白底 + 红橙点缀 · 方案 A</div>
    </div>
</div>

<div style="text-align:center;padding:14px;background:var(--bg-card);border-top:1px solid var(--line);">
    <a href="ui_redesign_index.html" class="btn btn-sm">‹ 返回方案对比</a>
    <a href="ui_red_a_dashboard.html" class="btn btn-sm">下一页：工作台 →</a>
</div>

</body>
</html>
