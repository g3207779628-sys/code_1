<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 B · 登录后欢迎页 · 金山仓储</title>
<link rel="stylesheet" href="ui_red_shared.css">
<style>
.welcome-page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background:
        radial-gradient(circle at 50% 35%, #FFD9CC 0%, #FFFAF7 60%);
}
.welcome-top { padding: 28px 48px; display: flex; justify-content: space-between; }
.welcome-brand {
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    display: flex; align-items: center; gap: 10px;
}
.welcome-brand .mark {
    width: 28px; height: 28px;
    background: var(--accent);
    color: #FFF; border-radius: var(--r-md);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(217,119,55,0.3);
}
.welcome-top .time { font-size: 12px; color: var(--ink-quiet); }

.welcome-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px; }
.welcome-mark {
    background: var(--accent);
    color: #FFF;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 18px;
}
.welcome-mega {
    font-size: 116px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 16px;
    line-height: 1;
    margin-bottom: 28px;
    text-shadow: 0 4px 24px rgba(217,119,55,0.18);
}
.welcome-sub {
    font-size: 28px; font-weight: 700;
    letter-spacing: 10px;
    color: var(--ink);
    margin-bottom: 10px;
}
.welcome-meta { font-size: 11px; color: var(--accent-deep); letter-spacing: 3px; margin-top: 6px; font-weight: 600; }

.welcome-card {
    margin-top: 56px;
    background: var(--bg-card);
    border: 2px solid var(--accent);
    border-radius: var(--r-lg);
    padding: 22px 32px;
    display: flex; align-items: center; gap: 24px;
    min-width: 440px;
    box-shadow: 0 8px 32px rgba(217,119,55,0.12);
}
.welcome-card .avatar {
    width: 56px; height: 56px;
    background: var(--accent);
    color: #FFF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
}
.welcome-card .info { flex: 1; }
.welcome-card .info .name { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.welcome-card .info .sub { font-size: 12px; color: var(--ink-quiet); }
.welcome-card .info .sub strong { color: var(--accent); }
.btn-enter {
    background: var(--accent);
    color: #FFF;
    border: none;
    padding: 12px 28px;
    border-radius: var(--r-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(217,119,55,0.3);
    transition: all 0.15s;
}
.btn-enter:hover { background: var(--accent-deep); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(217,119,55,0.4); }

.welcome-stat-row {
    margin-top: 28px;
    display: flex; gap: 28px;
}
.welcome-stat {
    text-align: center;
    padding: 0 12px;
}
.welcome-stat .num {
    font-size: 28px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
}
.welcome-stat .label {
    font-size: 11px; color: var(--ink-quiet); letter-spacing: 2px; margin-top: 6px;
}
.welcome-foot { padding: 24px 48px; display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faded); letter-spacing: 2px; }
</style>
</head>
<body>

<div class="demo-banner"><strong>方案 B · 红橙显眼</strong> · 登录后欢迎页 · 大红橙按钮、徽章、强调</div>

<div class="welcome-page">
    <div class="welcome-top">
        <div class="welcome-brand"><span class="mark">金</span> 金山仓储</div>
        <div class="time">2026-05-21 · 14:32</div>
    </div>

    <div class="welcome-main">
        <div class="welcome-mark">KINGSOFT · WAREHOUSE</div>
        <div class="welcome-mega">WELCOME</div>
        <div class="welcome-sub">金山仓储</div>
        <div class="welcome-meta">★ WAREHOUSE MANAGEMENT SYSTEM ★</div>

        <div class="welcome-card">
            <div class="avatar">王</div>
            <div class="info">
                <div class="name">王经理</div>
                <div class="sub">仓库经理 · 你有 <strong>3 项</strong> 待审批 · <strong>3 个</strong> 低库存</div>
            </div>
            <button class="btn-enter">进入工作台 →</button>
        </div>

        <div class="welcome-stat-row">
            <div class="welcome-stat"><div class="num">2,847</div><div class="label">在仓总数</div></div>
            <div class="welcome-stat"><div class="num">42</div><div class="label">本月入库</div></div>
            <div class="welcome-stat"><div class="num">31</div><div class="label">本月出库</div></div>
            <div class="welcome-stat"><div class="num">8</div><div class="label">待审批</div></div>
        </div>
    </div>

    <div class="welcome-foot">
        <div>金山仓储 V6.1</div>
        <div>白底 + 红橙点缀 · 方案 B</div>
    </div>
</div>

<div style="text-align:center;padding:14px;background:var(--bg-card);border-top:1px solid var(--line);">
    <a href="ui_redesign_index.html" class="btn btn-sm">‹ 返回方案对比</a>
    <a href="ui_red_b_dashboard.html" class="btn btn-sm">下一页：工作台 →</a>
</div>

</body>
</html>
