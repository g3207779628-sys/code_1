<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v13 · P2 · 新建入库单 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
.content { padding: 20px 28px; background: var(--bg-base); }
.layout { background: var(--bg-base); }
.sider { width: 200px; }
.menu li > a { padding: 7px 18px; font-size: 13px; }
.menu li > a.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
.header { height: 52px; }
.page-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.page-head .page-title { font-size: 18px; font-weight: 700; }
.page-head .page-sub { font-size: 12px; color: var(--ink-quiet); margin-left: 10px; }
.dense-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; margin-bottom: 12px; }
.dense-card .head { padding: 8px 14px; background: var(--bg-soft); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); }
.field-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.field-strip .field { display: flex; flex-direction: column; gap: 3px; }
.field-strip .field label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); font-weight: 600; }
.field-strip .field input, .field-strip .field select { padding: 6px 8px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; }
.field-strip .field .picker { padding: 6px 8px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.field-strip .field .picker:hover { border-color: var(--accent); }
.field-strip .field .picker .ar { color: var(--accent); font-size: 10px; }
.dense-table { width: 100%; border-collapse: collapse; }
.dense-table th { background: var(--bg-soft); padding: 7px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-quiet); text-align: left; border-bottom: 1px solid var(--line); }
.dense-table td { padding: 6px 12px; font-size: 12px; border-bottom: 1px solid var(--line-soft); }
.dense-table input { padding: 4px 8px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 3px; width: 100%; }
.dense-table .picker { padding: 4px 8px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 3px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.dense-table .picker:hover { border-color: var(--accent); }
.dense-table .picker .ar { color: var(--accent); font-size: 9px; }
.dense-table .del { color: var(--ink-faded); cursor: pointer; font-size: 14px; }
.dense-table .del:hover { color: var(--err); }
.dense-table tfoot td { background: var(--bg-soft); border-top: 1px solid var(--line); font-weight: 700; }
.add-row { padding: 8px 14px; font-size: 12px; color: var(--accent); cursor: pointer; border-top: 1px solid var(--line-soft); background: var(--bg-soft); }
.add-row:hover { background: var(--accent-soft); }
.note-row { padding: 8px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line-soft); }
.note-row label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); font-weight: 600; flex-shrink: 0; }
.note-row input { flex: 1; padding: 5px 8px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 3px; }
.attach-row { padding: 8px 14px; display: flex; gap: 12px; align-items: center; }
.attach-row label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); font-weight: 600; }
.attach-row .btn-attach { padding: 4px 10px; font-size: 11px; border: 1px dashed var(--accent); border-radius: 3px; color: var(--accent); cursor: pointer; background: var(--accent-soft); }
.actions-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg-soft); border-top: 1px solid var(--line); }
.actions-row .stat { font-size: 12px; color: var(--ink-quiet); }
.actions-row .stat .num { color: var(--accent); font-family: var(--font-mono); font-weight: 700; font-size: 14px; }
.actions-row .right { display: flex; gap: 8px; }
.demo-tag { position: fixed; top: 12px; right: 12px; background: var(--accent-deep); color: #FFF; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; padding: 4px 10px; border-radius: 2px; z-index: 999; }
</style>
</head>
<body>
<div class="demo-tag">MOCKUP · v13 P2 · INBOUND</div>

<div class="layout">
    <aside class="sider">
        <div class="sider-brand">金山仓储</div>
        <ul class="menu">
            <li class="menu-group">日常使用</li>
            <li><a href="#">工作台</a></li>
            <li class="menu-group">日常操作</li>
            <li><a href="#" class="active">入库</a></li>
            <li><a href="#">出库</a></li>
            <li><a href="#">调拨</a></li>
            <li><a href="#">盘点</a></li>
        </ul>
    </aside>

    <div class="main">
        <header class="header">
            <div class="crumb"><span class="prev">入库</span><span class="sep">/</span><span class="now">新建</span></div>
            <div class="header-actions"><span class="user-name">张经理</span><span class="quiet">退出</span></div>
        </header>

        <div class="content">
            <div class="page-head">
                <div><span class="page-title">新建入库单</span><span class="page-sub">RKD-20260521-004 · 自动生成</span></div>
                <a href="ui_v13_index.html" class="btn btn-sm">取消</a>
            </div>

            <div class="dense-card">
                <div class="head"><span>基本信息 + 明细</span><span>必填 3 项 · 紧凑模式</span></div>
                <div class="field-strip">
                    <div class="field"><label>入库日期 *</label><input type="date" value="2026-05-21"></div>
                    <div class="field"><label>供应商 *</label><div class="picker">贵州茅台经销商<span class="ar">换 →</span></div></div>
                    <div class="field"><label>目标仓库 *</label><div class="picker">金山主仓<span class="ar">换 →</span></div></div>
                    <div class="field"><label>采购单号 (可选)</label><input type="text" placeholder="PO-2026-xxxx"></div>
                </div>
                <table class="dense-table">
                    <thead><tr><th style="width:28%;">商品</th><th style="width:22%;">入库库位</th><th style="width:12%;">数量</th><th style="width:10%;">单位</th><th style="width:22%;">批次号</th><th style="width:6%;"></th></tr></thead>
                    <tbody>
                        <tr>
                            <td><div class="picker">茅台<span class="ar">换</span></div></td>
                            <td><div class="picker">酒柜-A1<span class="ar">换</span></div></td>
                            <td><input type="number" value="20" style="text-align:right;"></td>
                            <td><input value="瓶" readonly></td>
                            <td><input placeholder="自动"></td>
                            <td style="text-align:center;"><span class="del">×</span></td>
                        </tr>
                        <tr>
                            <td><div class="picker">五粮液<span class="ar">换</span></div></td>
                            <td><div class="picker">酒柜-A2<span class="ar">换</span></div></td>
                            <td><input type="number" value="12" style="text-align:right;"></td>
                            <td><input value="瓶" readonly></td>
                            <td><input placeholder="自动"></td>
                            <td style="text-align:center;"><span class="del">×</span></td>
                        </tr>
                    </tbody>
                    <tfoot><tr><td colspan="2" style="text-align:right;">合计</td><td style="text-align:right; color:var(--accent);">32</td><td>瓶</td><td colspan="2"></td></tr></tfoot>
                </table>
                <div class="add-row">+ 添加一行明细</div>
                <div class="note-row">
                    <label>备注</label>
                    <input type="text" placeholder="本次入库的说明 / 注意事项">
                </div>
                <div class="attach-row">
                    <label>附件</label>
                    <span class="btn-attach">+ 上传（采购合同 / 发票）</span>
                    <span style="font-size: 11px; color: var(--ink-faded); margin-left: auto;">0 个文件</span>
                </div>
                <div class="actions-row">
                    <div class="stat">明细 <span class="num">2</span> 行 · 合计 <span class="num">32</span> 件 · 附件 <span class="num">0</span></div>
                    <div class="right">
                        <a href="#" class="btn btn-sm">存为草稿</a>
                        <a href="#" class="btn btn-sm btn-primary">提交审批 →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
