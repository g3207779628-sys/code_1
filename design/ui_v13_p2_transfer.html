<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v13 · P2 · 新建调拨单 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
.content { padding: 20px 28px; background: var(--bg-base); }
.layout { background: var(--bg-base); }
.sider { width: 200px; }
.menu li > a { padding: 7px 18px; font-size: 13px; }
.menu li > a.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
.header { height: 52px; }
.page-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.page-head .page-title { font-size: 18px; font-weight: 700; }
.page-head .page-sub { font-size: 12px; color: var(--ink-quiet); margin-left: 10px; }
.dense-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; margin-bottom: 12px; }
.dense-card .head { padding: 8px 14px; background: var(--bg-soft); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); }
.flow-strip { display: grid; grid-template-columns: 1fr 30px 1fr 1fr; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); align-items: end; }
.flow-strip .field { display: flex; flex-direction: column; gap: 3px; }
.flow-strip .field label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); font-weight: 600; }
.flow-strip .field .picker, .flow-strip .field input, .flow-strip .field select { padding: 6px 8px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; }
.flow-strip .field .picker { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.flow-strip .field .picker .ar { color: var(--accent); font-size: 10px; }
.flow-strip .arrow-cell { display: flex; justify-content: center; align-items: center; font-size: 20px; color: var(--accent); font-weight: 700; padding-bottom: 4px; }
.dense-table { width: 100%; border-collapse: collapse; }
.dense-table th { background: var(--bg-soft); padding: 7px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-quiet); text-align: left; border-bottom: 1px solid var(--line); }
.dense-table td { padding: 6px 12px; font-size: 12px; border-bottom: 1px solid var(--line-soft); }
.dense-table input { padding: 4px 8px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 3px; width: 100%; }
.dense-table .picker { padding: 4px 8px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 3px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.dense-table .picker .ar { color: var(--accent); font-size: 9px; }
.dense-table .del { color: var(--ink-faded); cursor: pointer; font-size: 14px; }
.dense-table tfoot td { background: var(--bg-soft); border-top: 1px solid var(--line); font-weight: 700; }
.add-row { padding: 8px 14px; font-size: 12px; color: var(--accent); cursor: pointer; border-top: 1px solid var(--line-soft); background: var(--bg-soft); }
.note-row { padding: 8px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line-soft); }
.note-row label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-quiet); font-weight: 600; flex-shrink: 0; }
.note-row input { flex: 1; padding: 5px 8px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 3px; }
.actions-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg-soft); border-top: 1px solid var(--line); }
.actions-row .stat { font-size: 12px; color: var(--ink-quiet); }
.actions-row .stat .num { color: var(--accent); font-family: var(--font-mono); font-weight: 700; font-size: 14px; }
.actions-row .right { display: flex; gap: 8px; }
.demo-tag { position: fixed; top: 12px; right: 12px; background: var(--accent-deep); color: #FFF; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; padding: 4px 10px; border-radius: 2px; z-index: 999; }
</style>
</head>
<body>
<div class="demo-tag">MOCKUP · v13 P2 · TRANSFER</div>

<div class="layout">
    <aside class="sider">
        <div class="sider-brand">金山仓储</div>
        <ul class="menu">
            <li class="menu-group">日常使用</li>
            <li><a href="#">工作台</a></li>
            <li class="menu-group">日常操作</li>
            <li><a href="#">入库</a></li>
            <li><a href="#">出库</a></li>
            <li><a href="#" class="active">调拨</a></li>
            <li><a href="#">盘点</a></li>
        </ul>
    </aside>

    <div class="main">
        <header class="header">
            <div class="crumb"><span class="prev">调拨</span><span class="sep">/</span><span class="now">新建</span></div>
            <div class="header-actions"><span class="user-name">张经理</span><span class="quiet">退出</span></div>
        </header>

        <div class="content">
            <div class="page-head">
                <div><span class="page-title">新建调拨单</span><span class="page-sub">DBD-20260521-006 · 跨仓 / 跨库位</span></div>
                <a href="ui_v13_index.html" class="btn btn-sm">取消</a>
            </div>

            <div class="dense-card">
                <div class="head"><span>调拨方向 + 明细</span><span>从 → 到</span></div>
                <div class="flow-strip">
                    <div class="field"><label>调出 *</label><div class="picker">金山主仓 · 酒柜-A1<span class="ar">换 →</span></div></div>
                    <div class="arrow-cell">→</div>
                    <div class="field"><label>调入 *</label><div class="picker">研发中心仓 · 分仓-酒柜<span class="ar">换 →</span></div></div>
                    <div class="field"><label>日期 *</label><input type="date" value="2026-05-21"></div>
                </div>
                <table class="dense-table">
                    <thead><tr><th style="width:36%;">商品</th><th style="width:22%;">来源批次</th><th style="width:12%;">数量</th><th style="width:10%;">单位</th><th style="width:14%;">可调存量</th><th style="width:6%;"></th></tr></thead>
                    <tbody>
                        <tr>
                            <td><div class="picker">茅台<span class="ar">换</span></div></td>
                            <td><div class="picker">自动 (FIFO)<span class="ar">指定</span></div></td>
                            <td><input type="number" value="10" style="text-align:right;"></td>
                            <td><input value="瓶" readonly></td>
                            <td style="color:var(--ok); font-family:var(--font-mono);">128</td>
                            <td style="text-align:center;"><span class="del">×</span></td>
                        </tr>
                    </tbody>
                    <tfoot><tr><td colspan="2" style="text-align:right;">合计</td><td style="text-align:right; color:var(--accent);">10</td><td>瓶</td><td colspan="2"></td></tr></tfoot>
                </table>
                <div class="add-row">+ 添加一行明细</div>
                <div class="note-row">
                    <label>原因 / 备注</label>
                    <input type="text" placeholder="如：分仓酒柜库存偏低 / 季节性转移">
                </div>
                <div class="actions-row">
                    <div class="stat">明细 <span class="num">1</span> 行 · 合计 <span class="num">10</span> 件</div>
                    <div class="right">
                        <a href="#" class="btn btn-sm">存为草稿</a>
                        <a href="#" class="btn btn-sm btn-primary">立即执行 →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
