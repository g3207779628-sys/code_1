<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v17 P1 · 物品查询 · 左侧栏筛选 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
body { font-size: 13px; background: var(--bg-soft); padding: 24px 32px; }
.page { max-width: 1280px; margin: 0 auto; }
.back { display: inline-block; padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; text-decoration: none; color: var(--ink); font-size: 12px; margin-bottom: 14px; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.page-head .page-title { font-size: 20px; font-weight: 700; }
.page-head .page-sub { font-size: 12px; color: var(--ink-quiet); margin-left: 8px; }
.tag-demo { display: inline-block; font-size: 10px; letter-spacing: 2px; padding: 2px 8px; background: var(--accent-soft); color: var(--accent-deep); border-radius: 2px; font-weight: 600; margin-bottom: 6px; }
.layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
.filter-side { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; position: sticky; top: 16px; align-self: start; }
.filter-side h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
.filter-side h3 .reset { font-size: 11px; color: var(--accent); cursor: pointer; font-weight: 500; }
.filter-group { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--line-soft); }
.filter-group:last-child { border-bottom: none; }
.filter-group .group-label { font-size: 11px; color: var(--accent-deep); font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
.filter-field { margin-bottom: 10px; }
.filter-field label { display: block; font-size: 11px; color: var(--ink-quiet); margin-bottom: 4px; }
.filter-field .picker { padding: 6px 10px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.filter-field .picker.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
.filter-field .picker .ar { color: var(--accent); font-size: 10px; }
.filter-field input { width: 100%; padding: 6px 10px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; }
.toggle-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.toggle-mini { width: 28px; height: 16px; background: var(--accent); border-radius: 16px; position: relative; }
.toggle-mini::after { content: ''; position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; background: #FFF; border-radius: 50%; }
.toggle-mini.off { background: var(--line-input); }
.toggle-mini.off::after { left: 2px; right: auto; }
.filter-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.filter-actions .btn { flex: 1; padding: 8px; font-size: 12px; }

.main-area { display: flex; flex-direction: column; gap: 14px; }
.summary-strip { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 18px; display: flex; gap: 28px; }
.summary-strip .stat { font-size: 11px; color: var(--ink-quiet); }
.summary-strip .stat .num { font-size: 16px; font-family: var(--font-mono); color: var(--accent-deep); font-weight: 700; display: block; margin-top: 2px; }
.table-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.table-card table { width: 100%; border-collapse: collapse; }
.table-card th { background: var(--bg-soft); padding: 10px 12px; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: var(--ink); text-align: left; border-bottom: 1px solid var(--line); }
.table-card td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
.table-card .num-mono { font-family: var(--font-mono); }
.tag-info { background: var(--info-bg); color: var(--info); padding: 1px 6px; border-radius: 2px; font-size: 11px; }
.tag-warn { background: var(--warn-bg); color: var(--warn); padding: 1px 6px; border-radius: 2px; font-size: 11px; }
</style>
</head>
<body>
<div class="page">
<a class="back" href="ui_v17_query_index.html">← 返回 3 方案对比</a>

<div class="page-head">
    <div>
        <span class="tag-demo">P1 · 物品查询</span>
        <div class="page-title">物品查询</div>
        <span class="page-sub">7 个筛选条件全展开 · 共 20 个物品</span>
    </div>
</div>

<div class="layout">

    <aside class="filter-side">
        <h3>筛选 <span class="reset">重置</span></h3>

        <div class="filter-group">
            <div class="group-label">基本属性</div>
            <div class="filter-field">
                <label>品牌</label>
                <input type="text" placeholder="如 茅台 / 五粮液 / 得力" value="茅台">
            </div>
            <div class="filter-field">
                <label>用途</label>
                <input type="text" placeholder="如 招待 / 办公 / 福利">
            </div>
        </div>

        <div class="filter-group">
            <div class="group-label">分类</div>
            <div class="filter-field">
                <label>物品大类</label>
                <div class="picker active"><span>酒水</span><span class="ar">换 →</span></div>
            </div>
            <div class="filter-field">
                <label>物品类别</label>
                <div class="picker"><span class="placeholder" style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
            </div>
        </div>

        <div class="filter-group">
            <div class="group-label">归属</div>
            <div class="filter-field">
                <label>物品所属方</label>
                <div class="picker"><span class="placeholder" style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
            </div>
            <div class="filter-field">
                <label>物品管理方</label>
                <div class="picker"><span class="placeholder" style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
            </div>
        </div>

        <div class="filter-group">
            <div class="group-label">合同状态</div>
            <div class="toggle-row">
                <span class="toggle-mini off"></span>
                <span>仅看合同内物品</span>
            </div>
        </div>

        <div class="filter-actions">
            <button class="btn btn-secondary">清空</button>
            <button class="btn btn-primary">应用筛选</button>
        </div>
    </aside>

    <main class="main-area">
        <div class="summary-strip">
            <div class="stat"><span class="num">2</span> 命中物品</div>
            <div class="stat"><span class="num">2</span> 含合同内</div>
            <div class="stat"><span class="num">11</span> 品牌总数</div>
            <div class="stat"><span class="num">214</span> 在仓合计</div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>物品名</th>
                        <th>品牌</th>
                        <th>大类</th>
                        <th>类别</th>
                        <th>所属方</th>
                        <th>用途</th>
                        <th>合同</th>
                        <th class="text-right">在仓</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="num-mono">SP000001</td>
                        <td><strong>茅台</strong></td>
                        <td><span class="tag-info">茅台</span></td>
                        <td><span style="color:var(--accent-deep);">酒水</span></td>
                        <td>白酒</td>
                        <td>行政部</td>
                        <td>客户招待</td>
                        <td><span class="tag-warn">合同内</span></td>
                        <td class="num-mono" style="text-align:right;">128</td>
                    </tr>
                    <tr>
                        <td class="num-mono">SP000002</td>
                        <td><strong>茅台（小瓶）</strong></td>
                        <td><span class="tag-info">茅台</span></td>
                        <td><span style="color:var(--accent-deep);">酒水</span></td>
                        <td>白酒</td>
                        <td>行政部</td>
                        <td>客户招待</td>
                        <td><span class="tag-warn">合同内</span></td>
                        <td class="num-mono" style="text-align:right;">86</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>

</div>
</body>
</html>
