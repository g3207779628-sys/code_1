<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v17 P2 · 物品查询 · 顶部折叠 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
body { font-size: 13px; background: var(--bg-soft); padding: 24px 32px; }
.page { max-width: 1280px; margin: 0 auto; }
.back { display: inline-block; padding: 6px 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; text-decoration: none; color: var(--ink); font-size: 12px; margin-bottom: 14px; }
.back:hover { border-color: var(--accent); color: var(--accent); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.page-head .page-title { font-size: 20px; font-weight: 700; }
.page-head .page-sub { font-size: 12px; color: var(--ink-quiet); margin-left: 8px; }
.tag-demo { display: inline-block; font-size: 10px; letter-spacing: 2px; padding: 2px 8px; background: var(--accent-soft); color: var(--accent-deep); border-radius: 2px; font-weight: 600; margin-bottom: 6px; }
.filter-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 18px; margin-bottom: 14px; }
.filter-row1 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 90px; gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: var(--ink-quiet); }
.field input, .field .picker { padding: 7px 10px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--line-input); border-radius: 4px; height: 34px; box-sizing: border-box; }
.field .picker { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.field .picker.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
.field .picker .ar { color: var(--accent); font-size: 10px; }
.btn-apply { background: var(--accent); color: #FFF; border: 1px solid var(--accent); border-radius: 4px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; height: 34px; }
.more-toggle { margin-top: 12px; padding: 8px 14px; background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 4px; color: var(--accent-deep); font-size: 12px; cursor: pointer; text-align: center; font-weight: 600; }
.advanced { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.filter-row2 { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 10px; align-items: end; }
.contract-toggle { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.toggle-mini { width: 28px; height: 16px; background: var(--accent); border-radius: 16px; position: relative; }
.toggle-mini::after { content: ''; position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; background: #FFF; border-radius: 50%; }

.active-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-chip { background: var(--accent-soft); color: var(--accent-deep); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.filter-chip .x { cursor: pointer; opacity: 0.6; }

.summary-strip { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 18px; display: flex; gap: 28px; margin-bottom: 14px; }
.summary-strip .stat { font-size: 11px; color: var(--ink-quiet); }
.summary-strip .stat .num { font-size: 16px; font-family: var(--font-mono); color: var(--accent-deep); font-weight: 700; display: block; margin-top: 2px; }

.table-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.table-card table { width: 100%; border-collapse: collapse; }
.table-card th { background: var(--bg-soft); padding: 10px 12px; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: var(--ink); text-align: left; border-bottom: 1px solid var(--line); }
.table-card td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
.tag-info { background: var(--info-bg); color: var(--info); padding: 1px 6px; border-radius: 2px; font-size: 11px; }
.tag-warn { background: var(--warn-bg); color: var(--warn); padding: 1px 6px; border-radius: 2px; font-size: 11px; }
</style>
</head>
<body>
<div class="page">
<a class="back" href="ui_v17_query_index.html">← 返回 3 方案对比</a>

<div class="page-head">
    <div>
        <span class="tag-demo">P2 · 物品查询</span>
        <div class="page-title">物品查询</div>
        <span class="page-sub">顶部 4 项常用 + 高级 3 项折叠 · 共 20 个物品</span>
    </div>
</div>

<div class="filter-card">
    <div class="filter-row1">
        <div class="field">
            <label>搜索（名称 / 编号 / 品牌）</label>
            <input type="text" placeholder="如 茅台 / SP000001" value="茅台">
        </div>
        <div class="field">
            <label>物品大类</label>
            <div class="picker active"><span>酒水</span><span class="ar">换 →</span></div>
        </div>
        <div class="field">
            <label>物品类别</label>
            <div class="picker"><span style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
        </div>
        <div class="field">
            <label>合同状态</label>
            <div class="picker"><span style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
        </div>
        <button class="btn-apply">应用</button>
    </div>

    <div class="more-toggle">↑ 收起高级筛选</div>
    <div class="advanced">
        <div class="filter-row2">
            <div class="field">
                <label>品牌</label>
                <input type="text" placeholder="精确品牌名">
            </div>
            <div class="field">
                <label>用途</label>
                <input type="text" placeholder="精确用途">
            </div>
            <div class="field">
                <label>物品所属方</label>
                <div class="picker"><span style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
            </div>
            <div class="field">
                <label>物品管理方</label>
                <div class="picker"><span style="color:var(--ink-faded);">全部</span><span class="ar">选择 →</span></div>
            </div>
            <div class="contract-toggle">
                <span class="toggle-mini"></span>
                <span>仅合同内</span>
            </div>
        </div>
    </div>
</div>

<div class="active-filters">
    <span class="filter-chip">大类: 酒水 <span class="x">×</span></span>
    <span class="filter-chip">搜索: 茅台 <span class="x">×</span></span>
</div>

<div class="summary-strip">
    <div class="stat"><span class="num">2</span> 命中物品</div>
    <div class="stat"><span class="num">2</span> 含合同内</div>
    <div class="stat"><span class="num">11</span> 品牌总数</div>
    <div class="stat"><span class="num">214</span> 在仓合计</div>
</div>

<div class="table-card">
    <table>
        <thead>
            <tr>
                <th>编号</th>
                <th>物品名</th>
                <th>品牌</th>
                <th>大类</th>
                <th>类别</th>
                <th>所属方</th>
                <th>用途</th>
                <th>合同</th>
                <th class="text-right">在仓</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="num-mono">SP000001</td>
                <td><strong>茅台</strong></td>
                <td><span class="tag-info">茅台</span></td>
                <td><span style="color:var(--accent-deep);">酒水</span></td>
                <td>白酒</td>
                <td>行政部</td>
                <td>客户招待</td>
                <td><span class="tag-warn">合同内</span></td>
                <td style="text-align:right;">128</td>
            </tr>
            <tr>
                <td class="num-mono">SP000002</td>
                <td><strong>茅台（小瓶）</strong></td>
                <td><span class="tag-info">茅台</span></td>
                <td><span style="color:var(--accent-deep);">酒水</span></td>
                <td>白酒</td>
                <td>行政部</td>
                <td>客户招待</td>
                <td><span class="tag-warn">合同内</span></td>
                <td style="text-align:right;">86</td>
            </tr>
        </tbody>
    </table>
</div>

</div>
</body>
</html>
