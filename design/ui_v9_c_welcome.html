<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v9 方案 C · 已登录通用首页 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
body { background: var(--bg-soft); font-size: 13px; color: var(--ink); }
.layout { display: flex; min-height: 100vh; }

.sider {
    width: 200px; background: var(--bg-card);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; flex-shrink: 0;
}
.sider .brand {
    padding: 0 22px; height: 56px;
    display: flex; align-items: center;
    font-size: 15px; font-weight: 700; letter-spacing: 3px;
    border-bottom: 1px solid var(--line-soft);
}
.sider .brand .accent { color: var(--accent-deep); }
.sider .nav { flex: 1; padding: 12px 0; }
.sider .nav-item {
    display: flex; justify-content: space-between;
    padding: 9px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s;
}
.sider .nav-item:hover { background: var(--bg-input); }
.sider .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-left-color: var(--accent);
    font-weight: 600;
}
.sider .nav-item .arrow {
    font-family: var(--font-mono);
    color: var(--ink-faded); font-size: 12px;
}
.sider .foot {
    padding: 14px 22px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--font-mono);
    font-size: 10px; color: var(--ink-faded);
    letter-spacing: 2px;
}

.main {
    flex: 1; display: flex; flex-direction: column;
    background:
        radial-gradient(circle at 30% 30%, var(--accent-soft) 0%, var(--bg-base) 55%),
        radial-gradient(circle at 75% 75%, var(--bg-soft) 0%, var(--bg-base) 55%);
}
.main .head {
    height: 52px; padding: 0 28px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-card);
}
.main .head .crumb {
    font-size: 12px; color: var(--ink-quiet);
    letter-spacing: 1px;
}
.main .head .crumb .now { color: var(--ink-soft); font-weight: 500; }
.main .head .user { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.main .head .user .avatar {
    width: 28px; height: 28px;
    background: var(--accent-soft); color: var(--accent-deep);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
}
.main .head .user .name { color: var(--ink); font-weight: 500; }
.main .head .user .role { color: var(--ink-quiet); font-size: 11px; }
.main .head .user a {
    margin-left: 10px;
    font-size: 11px;
    color: var(--ink-quiet); text-decoration: none;
}
.main .head .user a:hover { color: var(--accent); }

.content {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 40px;
}

.v9-hero {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 32px;
}
.v9-hero-pre {
    font-family: var(--font-mono);
    font-size: 12px; font-weight: 600;
    letter-spacing: 8px;
    color: var(--accent-deep);
    margin-bottom: 12px;
}
.v9-hero-main {
    font-size: 96px; font-weight: 800;
    letter-spacing: 12px;
    line-height: 1;
    margin-bottom: 14px;
}
.v9-hero-main .fill { color: var(--accent-deep); }
.v9-hero-main .stroke {
    color: transparent;
    -webkit-text-stroke: 2px var(--accent-deep);
}
.v9-hero-sub {
    font-size: 20px; font-weight: 300;
    letter-spacing: 10px;
    color: var(--ink-soft);
    margin-bottom: 6px;
}

/* 6 大业务磁贴 */
.tile-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 940px;
    width: 100%;
}
.tile {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px 24px;
    display: flex; align-items: center; gap: 18px;
    text-decoration: none;
    color: var(--ink);
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
}
.tile:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}
.tile:hover .icon {
    background: var(--accent);
    color: #FFF;
}
.tile .icon {
    width: 48px; height: 48px;
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    font-family: var(--font-mono);
    flex-shrink: 0;
    transition: all 0.15s;
}
.tile .info { flex: 1; }
.tile .info .title {
    font-size: 14px; font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 4px;
    color: var(--ink);
}
.tile .info .stat {
    font-size: 11px;
    color: var(--ink-quiet);
    letter-spacing: 1px;
}
.tile .info .stat .num {
    font-family: var(--font-mono);
    color: var(--accent-deep);
    font-weight: 600;
}
.tile .arrow {
    color: var(--ink-faded);
    font-family: var(--font-mono);
    font-size: 16px;
    transition: color 0.15s;
}
.tile:hover .arrow { color: var(--accent); }

.demo-tag {
    position: fixed; top: 12px; right: 12px;
    background: var(--accent-deep); color: #FFF;
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 2px;
    padding: 4px 10px; border-radius: 2px;
    z-index: 999;
}
</style>
</head>
<body>

<div class="demo-tag">MOCKUP · C · /welcome (LOGGED IN)</div>

<div class="layout">

    <aside class="sider">
        <div class="brand">金山<span class="accent">仓储</span></div>
        <div class="nav">
            <div class="nav-item active">日常使用 <span class="arrow">▸</span></div>
            <div class="nav-item">日常操作 <span class="arrow">▸</span></div>
            <div class="nav-item">查询分析 <span class="arrow">▸</span></div>
            <div class="nav-item">数据维护 <span class="arrow">▸</span></div>
            <div class="nav-item">系统 <span class="arrow">▸</span></div>
        </div>
        <div class="foot">KINGSOFT-WMS V9</div>
    </aside>

    <main class="main">
        <div class="head">
            <div class="crumb">/ <span class="now">首页</span></div>
            <div class="user">
                <div class="avatar">张</div>
                <span class="name">张三</span>
                <span class="role">· 仓库管理员</span>
                <a href="#">退出</a>
            </div>
        </div>

        <div class="content">
            <div class="v9-hero">
                <div class="v9-hero-pre">KINGSOFT WAREHOUSE</div>
                <div class="v9-hero-main">
                    <span class="fill">WEL</span><span class="stroke">COME</span>
                </div>
                <div class="v9-hero-sub">金山仓库管理</div>
            </div>

            <div class="tile-grid">
                <a class="tile" href="ui_white_c_inbound_form.html">
                    <div class="icon">+</div>
                    <div class="info">
                        <div class="title">入库</div>
                        <div class="stat">待审批 <span class="num">3</span> 单</div>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a class="tile" href="#">
                    <div class="icon">→</div>
                    <div class="info">
                        <div class="title">出库</div>
                        <div class="stat">今日 <span class="num">2</span> 单</div>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a class="tile" href="#">
                    <div class="icon">⇌</div>
                    <div class="info">
                        <div class="title">调拨</div>
                        <div class="stat">本月 <span class="num">5</span> 单</div>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a class="tile" href="#">
                    <div class="icon">×</div>
                    <div class="info">
                        <div class="title">报损</div>
                        <div class="stat">待审 <span class="num">5</span> 条</div>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a class="tile" href="#">
                    <div class="icon">✓</div>
                    <div class="info">
                        <div class="title">盘点</div>
                        <div class="stat">下次 <span class="num">月底</span></div>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a class="tile" href="ui_white_c_inventory.html">
                    <div class="icon">≡</div>
                    <div class="info">
                        <div class="title">库存查询</div>
                        <div class="stat">在仓 <span class="num">1,247</span> 件</div>
                    </div>
                    <div class="arrow">→</div>
                </a>
            </div>
        </div>
    </main>

</div>

</body>
</html>
