<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v8 方案 C · 登录页 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
body {
    background:
        radial-gradient(circle at 30% 25%, var(--accent-soft) 0%, var(--bg-base) 50%),
        radial-gradient(circle at 80% 75%, var(--bg-soft) 0%, var(--bg-base) 60%);
    min-height: 100vh;
    font-size: 13px;
}
.login-page {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
}

/* 小卡片居中 — 关键规则 */
.login-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 40px 44px;
    width: 100%;
    max-width: 400px;       /* ← 小卡片必带 max-width */
    margin: 0 auto;          /* ← 小卡片必带 margin auto 居中 */
    box-shadow: var(--shadow-md);
}

.login-brand {
    text-align: center;
    margin-bottom: 28px;
}
.login-brand .pre {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 4px;
    margin-bottom: 12px;
}
.login-brand .mega {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 8px;
    line-height: 1;
    margin-bottom: 10px;
}
.login-brand .mega .fill { color: var(--accent); }
.login-brand .mega .stroke { color: transparent; -webkit-text-stroke: 1.5px var(--accent); }
.login-brand .name {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 4px;
    color: var(--ink);
    margin-top: 8px;
}

.form-row { margin-bottom: 14px; }
.form-row label {
    display: block;
    font-size: 12px;
    color: var(--ink-quiet);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.5px;
}
.form-row input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--line-input);
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
}
.form-row input:focus {
    outline: none;
    background: var(--bg-input-focus);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,69,0,0.10);
}

.btn-submit {
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    color: #FFF;
    border: 1px solid var(--accent);
    padding: 11px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
}
.btn-submit:hover { background: var(--accent-deep); }

.login-hint {
    margin-top: 22px;
    padding: 12px 14px;
    background: var(--bg-soft);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-sm);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-quiet);
    line-height: 1.8;
}
.login-hint strong { color: var(--ink); font-weight: 600; }

.center-rule {
    position: fixed;
    bottom: 16px; left: 16px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 12px 16px;
    max-width: 280px;
    font-size: 11px;
    color: var(--ink-quiet);
    line-height: 1.6;
    box-shadow: var(--shadow-sm);
}
.center-rule strong { color: var(--accent); display: block; margin-bottom: 4px; }
.center-rule code { background: var(--bg-soft); padding: 1px 5px; border-radius: 2px; font-family: var(--font-mono); font-size: 10px; }
</style>
</head>
<body>

<div class="demo-banner">
    <strong>v8 方案 C · 登录页</strong> · 演示「小卡片居中」规则 · max-width: 400px + margin: 0 auto
</div>

<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="pre">// KINGSOFT · WMS</div>
            <div class="mega"><span class="fill">WEL</span><span class="stroke">COME</span></div>
            <div class="name">金山仓储</div>
        </div>

        <form>
            <div class="form-row">
                <label>用户名</label>
                <input type="text" placeholder="admin" autofocus>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" placeholder="••••••">
            </div>
            <button type="button" class="btn-submit">登 录</button>
        </form>

        <div class="login-hint">
            <strong>测试账号</strong>
            admin / admin123 · manager / manager123 · staff / staff123
        </div>
    </div>
</div>

<div class="center-rule">
    <strong>v8 小卡片居中规则</strong>
    <code>max-width: 400px;</code><br>
    <code>margin: 0 auto;</code><br>
    适用：登录 / 改密 / 单独表单卡
</div>

</body>
</html>
