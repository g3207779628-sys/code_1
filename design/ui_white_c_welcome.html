<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v8 方案 C · 登录后欢迎页 · 金山仓储</title>
<link rel="stylesheet" href="ui_white_shared.css">
<style>
body { background: var(--bg-base); }
.welcome-page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background:
        radial-gradient(circle at 30% 25%, var(--accent-soft) 0%, var(--bg-base) 50%),
        radial-gradient(circle at 80% 70%, var(--bg-soft) 0%, var(--bg-base) 50%);
    font-size: 13px;
}
.welcome-top {
    padding: 22px 40px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line-soft);
}
.welcome-brand {
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    color: var(--ink);
    display: flex; align-items: center; gap: 10px;
}
.welcome-top .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-quiet);
    letter-spacing: 1px;
}

.welcome-main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 32px 40px;
}
.welcome-pre {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 6px;
    margin-bottom: 16px;
}
.welcome-mega {
    font-size: 124px;
    font-weight: 800;
    letter-spacing: 16px;
    line-height: 1;
    margin-bottom: 24px;
}
.welcome-mega .fill { color: var(--accent); }
.welcome-mega .stroke { color: transparent; -webkit-text-stroke: 2px var(--accent); }
.welcome-sub {
    font-size: 22px; font-weight: 300;
    letter-spacing: 10px;
    color: var(--ink);
    margin-bottom: 6px;
}
.welcome-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faded);
    letter-spacing: 3px;
    margin-top: 12px;
}

.welcome-card {
    margin-top: 52px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px 30px;
    display: flex; align-items: center; gap: 22px;
    min-width: 480px;
    box-shadow: var(--shadow-md);
}
.welcome-card .avatar {
    width: 48px; height: 48px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
}
.welcome-card .info { flex: 1; }
.welcome-card .info .name {
    font-size: 16px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
}
.welcome-card .info .sub {
    font-size: 12px; color: var(--ink-quiet);
}
.welcome-card .info .sub strong { color: var(--accent); font-weight: 600; }
.btn-enter {
    background: var(--accent);
    color: #FFF;
    border-radius: var(--r-sm);
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    letter-spacing: 1px;
}
.btn-enter:hover { background: var(--accent-deep); color: #FFF; }

.welcome-stats {
    margin-top: 22px;
    display: flex; gap: 36px;
    padding: 18px 32px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
}
.welcome-stats .item { text-align: center; }
.welcome-stats .num {
    font-family: var(--font-mono);
    font-size: 22px; font-weight: 700;
    color: var(--accent);
    line-height: 1;
}
.welcome-stats .num.err { color: var(--err); }
.welcome-stats .label {
    font-size: 10px;
    color: var(--ink-quiet);
    letter-spacing: 1.5px;
    margin-top: 6px;
    text-transform: uppercase;
}

.welcome-foot {
    padding: 18px 40px;
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 2px;
    border-top: 1px solid var(--line-soft);
}
.welcome-foot a { color: var(--ink-quiet); }
.welcome-foot a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="demo-banner">
    <strong>v8 方案 C · 登录后欢迎页</strong> · 所有人登录后先看到这里 · 点"进入工作台"跳转
</div>

<div class="welcome-page">
    <div class="welcome-top">
        <div class="welcome-brand">金山仓储</div>
        <div class="meta">SESSION · 2026-05-21 14:32</div>
    </div>

    <div class="welcome-main">
        <div class="welcome-pre">// KINGSOFT WAREHOUSE / V8</div>
        <div class="welcome-mega">
            <span class="fill">WEL</span><span class="stroke">COME</span>
        </div>
        <div class="welcome-sub">金山仓储</div>
        <div class="welcome-meta">KINGSOFT · WAREHOUSE MANAGEMENT</div>

        <div class="welcome-card">
            <div class="avatar">王</div>
            <div class="info">
                <div class="name">王经理</div>
                <div class="sub">仓库经理 · 你有 <strong>3 项</strong> 待审批 · <strong>3 个</strong> 低库存</div>
            </div>
            <a href="ui_white_c_dashboard.html" class="btn-enter">进入工作台 →</a>
        </div>

        <div class="welcome-stats">
            <div class="item"><div class="num">2,847</div><div class="label">在仓总数</div></div>
            <div class="item"><div class="num err">3</div><div class="label">低库存</div></div>
            <div class="item"><div class="num">8</div><div class="label">待审批</div></div>
            <div class="item"><div class="num">42</div><div class="label">本月入库</div></div>
            <div class="item"><div class="num">31</div><div class="label">本月出库</div></div>
        </div>
    </div>

    <div class="welcome-foot">
        <div>KINGSOFT-WMS · V8 BUILD 20260521</div>
        <div><a href="ui_white_index.html">‹ 方案对比</a></div>
    </div>
</div>

</body>
</html>
