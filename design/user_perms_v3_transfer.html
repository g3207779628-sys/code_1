<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>权限编辑 - 方案 3（双列穿梭）- 金山仓储</title>
<link rel="stylesheet" href="mockup_shared.css">
<style>
.page { max-width: 1200px; margin: 0 auto; padding: 24px; }

.user-banner {
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
}
.user-banner .info { display: flex; gap: 14px; align-items: center; }
.user-banner .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--ant-primary);
    color: #FFF;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
}
.user-banner h2 { font-size: 15px; font-weight: 600; }
.user-banner .sub { font-size: 12px; color: var(--ant-text-secondary); margin-top: 2px; }
.user-banner .progress {
    text-align: right;
    font-size: 13px;
}
.user-banner .progress .nums { font-family: var(--font-num); font-size: 18px; font-weight: 600; }

.transfer {
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    gap: 16px;
}
.transfer-box {
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 500px;
}
.transfer-box.right { border-left: 3px solid var(--ant-success); }
.transfer-head {
    padding: 12px 16px;
    background: #FAFAFA;
    border-bottom: 1px solid var(--ant-divider);
    display: flex; justify-content: space-between; align-items: center;
}
.transfer-head .title { font-size: 14px; font-weight: 600; }
.transfer-head .count {
    font-size: 12px; color: var(--ant-text-secondary);
}
.transfer-head .count strong {
    color: var(--ant-primary); font-family: var(--font-num);
}

.transfer-search {
    padding: 10px 16px;
    border-bottom: 1px solid var(--ant-divider);
}
.transfer-search input {
    width: 100%; padding: 6px 10px;
    border: 1px solid var(--ant-divider);
    border-radius: 4px; font-size: 13px;
}

.transfer-list { flex: 1; padding: 8px 0; overflow-y: auto; max-height: 400px; }
.transfer-group {
    padding: 6px 16px 4px;
    font-size: 11px; color: var(--ant-text-tertiary);
    text-transform: uppercase; letter-spacing: 0.5px;
    background: #FCFCFC;
}
.transfer-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
}
.transfer-item:hover { background: var(--ant-bg-hover); }
.transfer-item.selected { background: var(--ant-primary-light); }
.transfer-item input { width: 14px; height: 14px; cursor: pointer; }
.transfer-item .label { flex: 1; }

.transfer-actions {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 10px;
}
.arrow-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--ant-divider);
    background: #FFF;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: var(--ant-text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}
.arrow-btn:hover {
    background: var(--ant-primary); color: #FFF;
    border-color: var(--ant-primary);
    transform: scale(1.08);
}

.transfer-foot {
    padding: 10px 16px;
    border-top: 1px solid var(--ant-divider);
    background: #FAFAFA;
    font-size: 12px; color: var(--ant-text-secondary);
    text-align: center;
}

.footer {
    margin-top: 20px;
    padding: 14px 18px;
    background: #FFF;
    border: 1px solid var(--ant-divider);
    border-radius: 6px;
    display: flex; justify-content: flex-end; gap: 8px;
}
</style>
</head>
<body>

<div class="demo-banner">
    <strong>方案 3：双列穿梭框</strong> ｜ 左可分配 / 右已授权 / 中间箭头转移 · 支持批量转移
</div>

<div class="page">
    <a href="user_perms_index.html" class="btn btn-sm" style="margin-bottom: 16px;">‹ 返回方案列表</a>

    <div class="user-banner">
        <div class="info">
            <div class="avatar">张</div>
            <div>
                <h2>张志强 <span class="tag tag-default" style="margin-left:6px;">出库员</span></h2>
                <div class="sub">邮箱 zhang@example.com</div>
            </div>
        </div>
        <div class="progress">
            <div class="text-secondary" style="font-size:11px;">已授权 / 可选</div>
            <div class="nums"><span class="text-primary">5</span> / 16</div>
        </div>
    </div>

    <div class="transfer">

        <!-- 左：可分配 -->
        <div class="transfer-box">
            <div class="transfer-head">
                <div>
                    <span class="title">可分配权限</span>
                    <span class="count" style="margin-left:8px;">勾选 <strong>2</strong> 项</span>
                </div>
                <a href="#" style="font-size:12px;color:var(--ant-primary);">全选</a>
            </div>
            <div class="transfer-search"><input placeholder="搜索菜单..."></div>
            <div class="transfer-list">
                <div class="transfer-group">日常使用</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">待审批中心</span></label>

                <div class="transfer-group">日常操作</div>
                <label class="transfer-item selected"><input type="checkbox" checked><span class="label">入库</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">调拨</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">报损</span></label>
                <label class="transfer-item selected"><input type="checkbox" checked><span class="label">盘点</span></label>

                <div class="transfer-group">查询分析</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">库存流水</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">经营报表</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">库存预测</span></label>

                <div class="transfer-group">数据维护</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">商品</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">供应商</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">仓库</span></label>
            </div>
            <div class="transfer-foot">共 11 项可选</div>
        </div>

        <!-- 中间箭头 -->
        <div class="transfer-actions">
            <button class="arrow-btn" title="移到已授权">→</button>
            <button class="arrow-btn" title="移到可分配">←</button>
        </div>

        <!-- 右：已授权 -->
        <div class="transfer-box right">
            <div class="transfer-head">
                <div>
                    <span class="title">已授权权限</span>
                    <span class="count" style="margin-left:8px;">共 <strong>5</strong> 项</span>
                </div>
                <a href="#" style="font-size:12px;color:var(--ant-error);">全部清空</a>
            </div>
            <div class="transfer-search"><input placeholder="搜索已授权..."></div>
            <div class="transfer-list">
                <div class="transfer-group">日常使用</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">工作台</span></label>

                <div class="transfer-group">日常操作</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">出库</span></label>

                <div class="transfer-group">查询分析</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">库存查询</span></label>

                <div class="transfer-group">数据维护</div>
                <label class="transfer-item"><input type="checkbox"><span class="label">库位</span></label>
                <label class="transfer-item"><input type="checkbox"><span class="label">存储区</span></label>
            </div>
            <div class="transfer-foot">已授权 5 项 · 占总数 31%</div>
        </div>
    </div>

    <div class="footer">
        <a class="btn" href="javascript:history.back()">取消</a>
        <button class="btn btn-primary">保存权限</button>
    </div>
</div>

<script>
document.querySelectorAll('.transfer-item input').forEach(cb => {
    cb.addEventListener('change', () => cb.closest('label').classList.toggle('selected', cb.checked));
});
</script>
</body>
</html>
