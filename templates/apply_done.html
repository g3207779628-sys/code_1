<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>申请已提交</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_version }}">

</head>
<body class="apply-done-page">
<div class="box">
  <div class="tick" aria-hidden="true">✓</div>
  <h1>申请已提交</h1>
  <p class="lead">你的领用申请单已成功记录，无需审批，可凭下方单号到仓库领取。</p>
  {% if order_no %}
  <div class="no-box">
    <div class="lbl">申请单号</div>
    <div class="no">{{ order_no }}</div>
  </div>
  {% endif %}
  <div class="tip">📌 到仓库时，把这个单号报给库管即可。建议截图保存本页面。</div>
  <a class="btn" href="{{ url_for('apply_form') }}">再填一张申请单</a>
</div>
</body>
</html>
