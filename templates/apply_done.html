<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>申请已提交</title>
<style>
:root{--brand:#E05D1C;--brand-d:#BE4A12;--brand-soft:#FFF1E8;--ink:#1f2933;--muted:#8a94a0;
  --line:#e4e8ec;--ok:#15803d;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;}
*{box-sizing:border-box;}
body{margin:0;background:#eef1f4;color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:480px;width:100%;background:#fff;border-radius:16px;padding:34px 26px;text-align:center;
  box-shadow:0 4px 24px rgba(0,0,0,.08);}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;line-height:1;}
h1{margin:0 0 8px;font-size:20px;}
.lead{margin:0 0 22px;font-size:14px;color:var(--muted);line-height:1.6;}
.no-box{background:var(--brand-soft);border:1px dashed var(--brand);border-radius:12px;padding:16px;margin:0 0 24px;}
.no-box .lbl{font-size:12px;color:var(--brand-d);margin-bottom:6px;}
.no-box .no{font-size:24px;font-weight:800;font-family:var(--mono);color:var(--brand-d);letter-spacing:1px;}
.tip{font-size:13px;color:var(--ink);background:#f7f9fb;border-radius:10px;padding:12px 14px;
  margin:0 0 24px;line-height:1.6;text-align:left;}
.btn{display:inline-block;width:100%;background:var(--brand);color:#fff;text-decoration:none;
  border-radius:11px;padding:14px;font-size:16px;font-weight:700;}
.btn:active{background:var(--brand-d);}
</style>
</head>
<body>
<div class="box">
  <div class="tick" aria-hidden="true">✓</div>
  <h1>申请已提交</h1>
  <p class="lead">你的领用申请单已成功记录，无需审批，可凭下方单号到仓库领取。</p>
  {% if order_no %}
  <div class="no-box">
    <div class="lbl">申请单号</div>
    <div class="no">{{ order_no }}</div>
  </div>
  {% endif %}
  <div class="tip">📌 到仓库时，把这个单号报给库管即可。建议截图保存本页面。</div>
  <a class="btn" href="{{ url_for('apply_form') }}">再填一张申请单</a>
</div>
</body>
</html>
