{% extends "base.html" %}
{% block title %}{% if customer %}编辑{% else %}新增{% endif %}客户{% endblock %}
{% block content %}

<div class="card">
    <div class="card-header">{% if customer %}编辑客户：{{ customer.phone }}{% else %}新增客户{% endif %}</div>
    <div class="card-body">
        <form method="post">
            <div class="form-row">
                <label>手机号 <span style="color:var(--color-out);">*</span></label>
                <input type="text" name="phone" required value="{{ customer.phone if customer else '' }}">
            </div>
            <div class="form-row">
                <label>姓名</label>
                <input type="text" name="name" value="{{ customer.name if customer else '' }}">
            </div>
            <div class="form-row">
                <label>默认地址</label>
                <input type="text" name="default_address" value="{{ customer.default_address if customer else '' }}">
            </div>
            <button class="btn" type="submit">保存</button>
            <a class="btn btn-secondary" href="{{ url_for('customer_list') }}">取消</a>
        </form>
    </div>
</div>

{% endblock %}
