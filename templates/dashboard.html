{% extends "base.html" %}
{% block title %}经营报表{% endblock %}
{% block content %}

<div class="card">
    <div class="card-header">
        <span>出入库趋势</span>
        <form method="get" style="display:flex; gap:8px; align-items:center;">
            <label style="font-weight:400;">周期：
                <select name="period" onchange="this.form.submit()">
                    <option value="30d" {% if period=='30d' %}selected{% endif %}>近 30 天（按日）</option>
                    <option value="12mo" {% if period=='12mo' %}selected{% endif %}>近 12 个月（按月）</option>
                </select>
            </label>
            <input type="hidden" name="date_from" value="{{ date_from }}">
            <input type="hidden" name="date_to" value="{{ date_to }}">
        </form>
    </div>
    <div class="card-body">
        <canvas id="chart-inout-trend" height="80"></canvas>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <span>实时分布</span>
        <form method="get" style="display:flex; gap:8px; align-items:center; font-size:13px;">
            <input type="hidden" name="period" value="{{ period }}">
            <label>从 <input type="date" name="date_from" value="{{ date_from }}" style="width:140px;"></label>
            <label>到 <input type="date" name="date_to" value="{{ date_to }}" style="width:140px;"></label>
            <button class="btn btn-secondary btn-sm" type="submit">应用</button>
        </form>
    </div>
    <div class="card-body">
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
            <div>
                <h4 style="margin:0 0 8px 0;">库存按存储区分布</h4>
                <canvas id="chart-zone-dist" height="180"></canvas>
                <div style="font-size:11px; color:var(--ink-quiet); margin-top:4px;">实时快照，日期不影响</div>
            </div>
            <div>
                <h4 style="margin:0 0 8px 0;">流水类型（{{ date_from }} ~ {{ date_to }}）</h4>
                <canvas id="chart-log-type" height="180"></canvas>
            </div>
            <div>
                <h4 style="margin:0 0 8px 0;">库存健康度（低于安全库存的物品数）</h4>
                <canvas id="chart-stock-health" height="180"></canvas>
                <div style="font-size:11px; color:var(--ink-quiet); margin-top:4px;">实时快照，日期不影响</div>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">排行</div>
    <div class="card-body">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div>
                <h4 style="margin:0 0 8px 0;">库存 TOP 10 SKU</h4>
                <canvas id="chart-inv-top" height="220"></canvas>
            </div>
            <div>
                <h4 style="margin:0 0 8px 0;">活跃物品 TOP 10（近 30 天出库量）</h4>
                <canvas id="chart-active-sku" height="220"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const data = {{ charts_json|safe }};
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
Chart.defaults.color = '#425466';

// 出入库趋势（双折线）
new Chart(document.getElementById('chart-inout-trend'), {
    type: 'line',
    data: {
        labels: data.inout_trend.labels,
        datasets: [
            {label:'入库', data: data.inout_trend.in_data, borderColor:'#1A7F37', backgroundColor:'rgba(26,127,55,0.08)', fill:true, tension:0.25},
            {label:'出库', data: data.inout_trend.out_data, borderColor:'#B86E00', backgroundColor:'rgba(184,110,0,0.08)', fill:true, tension:0.25},
        ]
    },
    options: {responsive:true, plugins:{legend:{display:true}}, scales:{y:{beginAtZero:true, title:{display:true, text:'数量'}}}}
});

// 4 区库存分布（饼图）
new Chart(document.getElementById('chart-zone-dist'), {
    type: 'doughnut',
    data: {labels: data.zone_dist.labels,
           datasets: [{data: data.zone_dist.data, backgroundColor:['#0A2540','#0073E6','#1A7F37','#B86E00']}]},
    options: {responsive: true}
});

// 流水类型（饼图）
new Chart(document.getElementById('chart-log-type'), {
    type: 'doughnut',
    data: {labels: data.log_type.labels,
           datasets: [{data: data.log_type.data, backgroundColor:['#1A7F37','#C5221F','#B86E00','#8898AA','#0073E6','#425466']}]},
    options: {responsive: true}
});

// 库存健康度（饼图）
new Chart(document.getElementById('chart-stock-health'), {
    type: 'doughnut',
    data: {labels: data.stock_health.labels,
           datasets: [{data: data.stock_health.data,
                       backgroundColor:['#C5221F','#1A7F37']}]},
    options: {responsive:true}
});

// 库存 TOP 10
new Chart(document.getElementById('chart-inv-top'), {
    type: 'bar',
    data: {labels: data.inv_top.labels, datasets: [{label:'在仓', data: data.inv_top.data, backgroundColor:'#0A2540'}]},
    options: {responsive:true, indexAxis:'y', plugins:{legend:{display:false}}}
});

// 活跃物品 TOP 10
new Chart(document.getElementById('chart-active-sku'), {
    type: 'bar',
    data: {labels: data.active_sku.labels, datasets: [{label:'近30天出库', data: data.active_sku.data, backgroundColor:'#B86E00'}]},
    options: {responsive:true, indexAxis:'y', plugins:{legend:{display:false}}}
});
</script>

{% endblock %}
