<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 金山仓储</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
    body {
        background:
            radial-gradient(circle at 30% 25%, var(--accent-soft) 0%, var(--bg-base) 50%),
            radial-gradient(circle at 80% 75%, var(--bg-soft) 0%, var(--bg-base) 60%);
        min-height: 100vh;
        font-size: 13px;
    }
    .login-page {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 32px;
    }

    /* 小卡片居中：max-width 400px + margin auto */
    .login-card {
        background: var(--bg-card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 40px 44px;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        box-shadow: var(--shadow-md);
    }

    .login-brand {
        text-align: center;
        margin-bottom: 28px;
    }
    .login-brand .pre {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--accent);
        letter-spacing: 4px;
        margin-bottom: 12px;
    }
    .login-brand .mega {
        font-size: 52px;
        font-weight: 800;
        letter-spacing: 8px;
        line-height: 1;
        margin-bottom: 10px;
    }
    .login-brand .mega .fill { color: var(--accent); }
    .login-brand .mega .stroke { color: transparent; -webkit-text-stroke: 1.5px var(--accent); }
    .login-brand .name {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 4px;
        color: var(--ink);
        margin-top: 8px;
    }

    .login-form .form-row { margin-bottom: 14px; }
    .login-form .form-row label {
        display: block;
        font-size: 12px;
        color: var(--ink-quiet);
        margin-bottom: 6px;
        font-weight: 500;
        letter-spacing: 0.5px;
    }
    .login-form input[type=text],
    .login-form input[type=password] {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--line-input);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--ink);
        font-family: inherit;
    }
    .login-form input:focus {
        outline: none;
        background: var(--bg-input-focus);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.10);
    }
    .login-form button[type=submit] {
        width: 100%;
        margin-top: 12px;
        background: var(--accent);
        color: #FFF;
        border: 1px solid var(--accent);
        padding: 11px 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 4px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background 0.15s;
        font-family: inherit;
    }
    .login-form button[type=submit]:hover { background: var(--accent-hover); }

    .login-hint {
        margin-top: 22px;
        padding: 12px 14px;
        background: var(--bg-soft);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-quiet);
        line-height: 1.8;
    }
    .login-hint strong { color: var(--ink); font-weight: 600; }

    .login-flash { margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="pre">// KINGSOFT · WMS</div>
            <div class="mega"><span class="fill">WEL</span><span class="stroke">COME</span></div>
            <div class="name">金山仓储</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="login-flash">
                {% for category, msg in messages %}
                <div class="flash {{ category }}">{{ msg }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="post" class="login-form">
            <div class="form-row">
                <label>用户名</label>
                <input type="text" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">登 录</button>
        </form>

        <div class="login-hint">
            <strong>测试账号</strong><br>
            admin / admin123 · manager / manager123 · staff / staff123
        </div>
    </div>
</div>

</body>
</html>
