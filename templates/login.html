<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 — code_1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-box">
    <h1>CODE_1 仓储</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    <form method="post">
        <div class="form-row">
            <label>用户名</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-row">
            <label>密码</label>
            <input type="password" name="password" required>
        </div>
        <button class="btn" type="submit" style="width:100%;">登 录</button>
    </form>
    <div style="margin-top:24px; font-size:12px; color:var(--color-text-soft);">
        测试账号：admin/admin123 · manager/manager123 · staff/staff123
    </div>
</div>
</body>
</html>
