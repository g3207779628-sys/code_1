{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}

<div class="center-card">

<div class="card">
    <div class="card-header">修改密码</div>
    <div class="card-body">
        {% if session.must_change_password %}
        <div class="flash warning" style="margin-bottom:16px;">为了账号安全，首次登录请先将初始密码修改为只有你知道的密码。未改密前无法访问其他页面。</div>
        {% endif %}
        <form method="post" id="pwd-form">
            <div class="form-row">
                <label>旧密码 <span class="text-error">*</span></label>
                <input type="password" name="old_password" required>
            </div>
            <div class="form-row">
                <label>新密码 <span class="text-error">*</span></label>
                <input type="password" name="new_password" id="new-pwd" minlength="6" required>
                <span class="inline-msg info" id="pwd-hint" style="margin-top:6px;">至少 6 位</span>
            </div>
            <div class="form-row">
                <label>确认新密码 <span class="text-error">*</span></label>
                <input type="password" name="confirm_password" id="confirm-pwd" minlength="6" required>
                <span class="inline-msg" id="confirm-hint" style="margin-top:6px;display:none;"></span>
            </div>
            <button class="btn btn-primary" type="submit">提交</button>
        </form>
    </div>
</div>

</div><!-- /.center-card -->

<script>
(function () {
    var pwd = document.getElementById('new-pwd');
    var conf = document.getElementById('confirm-pwd');
    var pwdHint = document.getElementById('pwd-hint');
    var confHint = document.getElementById('confirm-hint');

    function updatePwd() {
        var v = pwd.value;
        if (!v) { pwdHint.className = 'inline-msg info'; pwdHint.textContent = '至少 6 位'; return; }
        if (v.length < 6) { pwdHint.className = 'inline-msg error'; pwdHint.textContent = '还差 ' + (6 - v.length) + ' 位'; return; }
        pwdHint.className = 'inline-msg success';
        pwdHint.textContent = '密码长度合格';
    }
    function updateConfirm() {
        var v = conf.value;
        if (!v) { confHint.style.display = 'none'; return; }
        confHint.style.display = 'inline-flex';
        if (v !== pwd.value) {
            confHint.className = 'inline-msg error';
            confHint.textContent = '两次输入不一致';
        } else {
            confHint.className = 'inline-msg success';
            confHint.textContent = '两次输入一致';
        }
    }
    pwd.addEventListener('input', function () { updatePwd(); if (conf.value) updateConfirm(); });
    conf.addEventListener('input', updateConfirm);
})();
</script>

{% endblock %}
