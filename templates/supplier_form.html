{% extends "base.html" %}
{% block title %}{% if supplier %}编辑{% else %}新增{% endif %}供应商{% endblock %}
{% block content %}

<div class="card">
    <div class="card-header">{% if supplier %}编辑供应商：{{ supplier.name }}{% else %}新增供应商{% endif %}</div>
    <div class="card-body">
        <form method="post">
            <div class="form-row">
                <label>名称 <span style="color:var(--color-out);">*</span></label>
                <input type="text" name="name" required value="{{ supplier.name if supplier else '' }}">
            </div>
            <div class="form-row">
                <label>联系人</label>
                <input type="text" name="contact" value="{{ supplier.contact if supplier else '' }}">
            </div>
            <div class="form-row">
                <label>电话</label>
                <input type="text" name="phone" value="{{ supplier.phone if supplier else '' }}">
            </div>
            <div class="form-row">
                <label>质量评分（0-100）</label>
                <input type="number" name="quality_score" min="0" max="100" value="{{ supplier.quality_score if supplier else 100 }}">
            </div>
            <button class="btn" type="submit">保存</button>
            <a class="btn btn-secondary" href="{{ url_for('supplier_list') }}">取消</a>
        </form>
    </div>
</div>

{% endblock %}
