{% extends "base.html" %}
{% block title %}新建用户{% endblock %}
{% block content %}

<a class="btn btn-secondary btn-sm" href="{{ url_for('user_admin') }}">‹ 返回用户列表</a>

<div class="card" style="margin-top:12px;">
    <div class="card-header">新建用户</div>
    <div class="card-body">
        <form method="post">
            <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;">
                <div class="form-row">
                    <label>用户名 <span style="color:var(--err);">*</span></label>
                    <input type="text" name="username" required placeholder="登录用户名">
                </div>
                <div class="form-row">
                    <label>初始密码 <span style="color:var(--err);">*</span> <span style="font-weight:400;color:var(--ink-quiet);font-size:11px;">（≥ 6 位）</span></label>
                    <input type="text" name="password" minlength="6" required placeholder="员工首次登录会强制改密">
                </div>
                <div class="form-row">
                    <label>岗位<span style="font-weight:400;color:var(--ink-quiet);font-size:11px;">（多选，可不选）</span></label>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <input type="hidden" name="position" id="new-user-pos" value="">
                        <span class="picker-label" id="new-user-pos-label" style="padding:6px 10px; background:var(--bg-alt); border-radius:4px; min-width:200px; display:inline-block;">未选择</span>
                        <button type="button" class="btn btn-sm" onclick="openPicker('position', 'new-user-pos', {multi: 1})">选岗位</button>
                    </div>
                </div>
                <div class="form-row">
                    <label>邮箱 <span style="font-weight:400;color:var(--ink-quiet);font-size:11px;">（收邮件预警）</span></label>
                    <input type="email" name="email" placeholder="如 user@qq.com，可空">
                </div>
                <div class="form-row">
                    <label>手机号 <span style="font-weight:400;color:var(--ink-quiet);font-size:11px;">（收短信预警）</span></label>
                    <input type="text" name="phone" placeholder="11 位手机号，可空">
                </div>
            </div>

            <div style="margin-top:20px; padding:12px 14px; background:var(--bg-alt); border-radius:4px;">
                <div style="font-size:12px; color:var(--ink-quiet); line-height:1.7;">
                    <strong style="color:var(--ink);">说明：</strong>
                    新用户默认仅有「工作台」权限。<strong style="color:var(--color-primary);">创建后将自动跳转到权限设置页</strong>，可在那里勾选其他菜单。
                </div>
            </div>

            <div style="margin-top:16px; display:flex; gap:8px;">
                <button class="btn btn-primary" type="submit">创建并进入权限设置</button>
                <a class="btn btn-secondary" href="{{ url_for('user_admin') }}">取消</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
